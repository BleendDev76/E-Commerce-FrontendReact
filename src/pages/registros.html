<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Crear Cuenta | Comida Chilena</title>

    <link rel="stylesheet" href="/src/css/home-styles.css" />
    <link rel="stylesheet" href="/src/css/auth-styles.css" />
  </head>

  <body>
    <main class="auth-container">
      <section class="auth-card">
        <h1>Crear Cuenta</h1>

        <p class="auth-subtitle">Regístrate para comprar nuestros productos</p>

        <form id="registroForm" method="post" novalidate>
          <!-- RUT -->
          <div class="form-group">
            <label for="rut">RUT</label>
            <input
              type="text"
              id="rut"
              name="rut"
              placeholder="11111111-1"
              maxlength="12"
              aria-describedby="rutAyuda rutError"
            />
            <small id="rutAyuda" class="form-ayuda"
              >Formato obligatorio: 11111111-1.</small
            >
            <small id="rutError" class="error-message"></small>
          </div>

          <!-- Nombre -->
          <div class="form-group">
            <label for="nombre">Nombre</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Tu nombre"
              maxlength="50"
              autocomplete="name"
            />
            <small id="nombreError" class="error-message"></small>
          </div>

          <!-- Apellidos -->
          <div class="form-group">
            <label for="apellidos">Apellidos</label>
            <input
              type="text"
              id="apellidos"
              name="apellidos"
              placeholder="Tus apellidos"
              maxlength="100"
            />
            <small id="apellidosError" class="error-message"></small>
          </div>

          <!-- Correo -->
          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="ejemplo@gmail.com"
              maxlength="100"
              autocomplete="email"
              aria-describedby="emailAyuda emailError"
            />
            <small id="emailAyuda" class="form-ayuda"
              >Solo @duoc.cl, @duocuc.cl, @profesor.duoc.cl o @gmail.com.</small
            >
            <small id="emailError" class="error-message"></small>
          </div>

          <!-- Contraseña -->
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Mínimo 6 caracteres"
              autocomplete="new-password"
              aria-describedby="passwordAyuda passwordError"
            />
            <small id="passwordAyuda" class="form-ayuda"
              >Mínimo 6 caracteres.</small
            >
            <small id="passwordError" class="error-message"></small>
          </div>

          <!-- Fecha de nacimiento -->
          <div class="form-group">
            <label for="fechaNacimiento">Fecha de nacimiento</label>
            <input
              type="date"
              id="fechaNacimiento"
              name="fechaNacimiento"
              autocomplete="bday"
              aria-describedby="fechaNacimientoAyuda fechaNacimientoError"
            />
            <small id="fechaNacimientoAyuda" class="form-ayuda"
              >Opcional.</small
            >
            <small id="fechaNacimientoError" class="error-message"></small>
          </div>

          <!-- Región -->
          <div class="form-group">
            <label for="region">Región</label>
            <select id="region" name="region" autocomplete="address-level1">
              <option value="">Selecciona una región</option>
            </select>
            <small id="regionError" class="error-message"></small>
          </div>

          <!-- Comuna -->
          <div class="form-group">
            <label for="comuna">Comuna</label>
            <select id="comuna" name="comuna" autocomplete="address-level2" disabled>
              <option value="">Selecciona una comuna</option>
            </select>
            <small id="comunaError" class="error-message"></small>
          </div>

          <!-- Dirección -->
          <div class="form-group">
            <label for="direccion">Dirección</label>
            <input
              type="text"
              id="direccion"
              name="direccion"
              placeholder="Calle y número"
              maxlength="300"
              autocomplete="street-address"
              aria-describedby="direccionAyuda direccionError"
            />
            <small id="direccionAyuda" class="form-ayuda"
              >Calle y número, por ejemplo Av. Providencia 1234.</small
            >
            <small id="direccionError" class="error-message"></small>
          </div>

          <!-- Términos y privacidad -->
          <div class="form-group form-group--check">
            <input
              type="checkbox"
              id="aceptaTerminos"
              name="terminos"
              aria-describedby="terminosError"
              required
            />
            <label for="aceptaTerminos">
              Acepto los
              <a
                href="/src/pages/terminos.html"
                target="_blank"
                rel="noopener noreferrer"
                >términos y condiciones</a
              >
              y la
              <a
                href="/src/pages/privacidad.html"
                target="_blank"
                rel="noopener noreferrer"
                >política de privacidad</a
              >.
            </label>
            <small id="terminosError" class="error-message"></small>
          </div>

          <button type="submit" id="registroButton" class="btn">
            Crear Cuenta
          </button>

          <p id="registroMessage" class="form-message" aria-live="polite"></p>

          <button type="button" id="reenviarCorreo" class="btn-texto">
            Reenviar correo de confirmación
          </button>
        </form>

        <p class="register-link">
          ¿Ya tienes una cuenta?
          <a href="/src/pages/login.html">Iniciar sesión</a>
        </p>

        <a href="/" class="auth-volver">&larr; Volver a la tienda</a>
      </section>
    </main>

    <!-- Lógica del Registro -->
    <script type="module" src="/src/js/registro.js"></script>
  </body>
</html>
